<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Practice - Harvard Referencing</title>
    <link rel="stylesheet" href="../src/styles/styles.css">
    <script src="../src/scripts/style-loader.js"></script>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='../index.html'">🏠 Home</button>
            <button class="nav-btn" onclick="window.history.back()">← Back</button>
        </div>

        <header>
            <h1>Newspaper Referencing Practice</h1>
            <p class="subtitle">Test your knowledge with these practice questions</p>
        </header>

        <main>
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <!-- Questions Container -->
            <div id="questions-container"></div>

            <!-- Results Container (hidden initially) -->
            <div id="results-container" class="hidden">
                <div class="results-box">
                    <h2>🎉 Practice Complete!</h2>
                    <p>Great work! You've completed all the newspaper referencing questions.</p>
                    <div class="section-buttons">
                        <button class="section-button" onclick="window.location.reload()">
                            🔄 Practice Again
                        </button>
                        <button class="section-button" onclick="window.location.href='../tutorials/newspaper-tutorial.html'">
                            📚 Review Tutorial
                        </button>
                        <button class="section-button" onclick="window.location.href='../index.html'">
                            🏠 Back to Home
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../src/scripts/navbar.js"></script>
    <script src="../src/scripts/practice-handler.js"></script>
    <script>
        // Initialize the practice session for newspapers
        // 2 with author, 2 organisation as author, 1 no author, 2 online, 1 editorial = 8 total
        initializePractice('newspapers', {
            withAuthorCitations: 5,
            organisationAsAuthor: 5,
            noAuthorCitations: 5,
            //special cases
            printNewspapers: 5,
            printNewspapersNoAuthor: 5,
            onlineNewspapers: 5,
            editorial: 5,
            letterToEditor: 5
        });
    </script>
