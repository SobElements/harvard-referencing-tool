<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Practice - Harvard Referencing</title>
    <link rel="stylesheet" href="../src/styles/styles.css">
    <script src="../src/scripts/style-loader.js"></script>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='../index.html'">🏠 Home</button>
            <button class="nav-btn" onclick="window.history.back()">← Back</button>
        </div>

        <header>
            <h1>Newspaper Referencing Practice</h1>
            <p class="subtitle">Test your knowledge with these practice questions</p>
        </header>

        <main>

            <!-- MODE SELECTOR - shown first, hidden once a mode is chosen -->
            <div id="mode-selector" style="text-align: center; padding: 40px 20px;">
                <h2 style="color: #2c3e50; margin-bottom: 10px;">Choose your practice mode</h2>
                <p style="color: #7f8c8d; margin-bottom: 40px;">Select the level that suits you</p>

                <div style="display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;">

                    <button class="section-button" onclick="startPractice('beginner')" style="max-width: 280px; padding: 30px 20px;">
                        <div style="font-size: 2rem; margin-bottom: 10px;">🟢</div>
                        <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;">Beginner</div>
                        <div style="font-size: 0.95rem; font-weight: normal;">Fill in the labelled fields — the structure is provided for you</div>
                    </button>

                    <button class="section-button" onclick="startPractice('intermediate')" style="max-width: 280px; padding: 30px 20px;">
                        <div style="font-size: 2rem; margin-bottom: 10px;">🟡</div>
                        <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px;">Intermediate</div>
                        <div style="font-size: 0.95rem; font-weight: normal;">Type the full reference yourself — including correct punctuation and italics</div>
                    </button>

                </div>
            </div>

            <!-- PROGRESS BAR - hidden until practice starts -->
            <div id="progress-bar" style="display: none; background-color: #e0e0e0; height: 8px; border-radius: 4px; margin-bottom: 30px;">
                <div id="progress-fill" style="background-color: #667eea; height: 100%; width: 0%; transition: width 0.3s ease; border-radius: 4px;"></div>
            </div>

            <!-- QUESTIONS - hidden until practice starts -->
            <div id="questions-container" style="display: none;">
            </div>

            <!-- RESULTS - hidden until all questions answered -->
            <div id="results-container" class="hidden">
                <div style="text-align: center; padding: 40px;">
                    <h2 style="color: #2c3e50; margin-bottom: 20px;">Practice Complete!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">You've completed all questions.</p>
                    <div class="section-buttons">
                        <button class="section-button" onclick="location.reload()">
                            🔄 Try Again
                        </button>
                        <button class="section-button" onclick="window.location.href='../tutorials/newspaper-tutorial.html'">
                            📚 Review Tutorial
                        </button>
                        <button class="section-button" onclick="window.location.href='../index.html'">
                            🏠 Back to Home
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="../src/scripts/navbar.js"></script>
    <script src="../src/scripts/practice-handler.js"></script>
    <script>
        function startPractice(mode) {
            document.getElementById('mode-selector').style.display = 'none';
            document.getElementById('progress-bar').style.display = 'block';
            document.getElementById('questions-container').style.display = 'block';

            initializePractice('newspapers', {
                withAuthorCitations: 5,
                organisationAsAuthor: 5,
                noAuthorCitations: 5,
                printNewspapers: 5,
                printNewspapersNoAuthor: 5,
                onlineNewspapers: 5,
                editorial: 5,
                letterToEditor: 5
            }, mode);
        }
    </script>
</body>
</html>
