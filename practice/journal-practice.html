<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Practice - Harvard Referencing</title>
    <link rel="stylesheet" href="../src/styles/styles.css">
    <script src="../src/scripts/style-loader.js"></script>
</head>
<body>
    <div class="container">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='../index.html'">🏠 Home</button>
            <button class="nav-btn" onclick="window.history.back()">← Back</button>
        </div>

        <header>
            <h1>Journal Referencing Practice</h1>
            <p class="subtitle">Test your knowledge with these practice questions</p>
        </header>

        <main>
            <div id="progress-bar" style="background-color: #e0e0e0; height: 8px; border-radius: 4px; margin-bottom: 30px;">
                <div id="progress-fill" style="background-color: #667eea; height: 100%; width: 0%; transition: width 0.3s ease; border-radius: 4px;"></div>
            </div>

            <div id="questions-container">
                <!-- Questions will be loaded here by JavaScript -->
            </div>

            <div id="results-container" class="hidden">
                <div style="text-align: center; padding: 40px;">
                    <h2 style="color: #2c3e50; margin-bottom: 20px;">Practice Complete!</h2>
                    <p style="font-size: 1.2rem; margin-bottom: 30px;">You've completed all questions.</p>
                    <div class="section-buttons">
                        <button class="section-button" onclick="location.reload()">
                            🔄 Try Again
                        </button>
                        <button class="section-button" onclick="window.location.href='../tutorials/journal-tutorial.html'">
                            📚 Review Tutorial
                        </button>
                        <button class="section-button" onclick="window.location.href='../index.html'">
                            🏠 Back to Home
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../src/scripts/navbar.js"></script>
    <script src="../src/scripts/practice-handler.js"></script>
    <script>
        // Initialize the practice session for journals
        // 2 direct quotes, 2 paraphrasing, 1 reference list = 5 questions total
        initializePractice('journals', {
            directQuotes: 5,
            paraphrasing: 5,
            referenceList: 5,
            //special cases
            referenceListWithDOI: 5,
            multipleAuthorsQuote: 5
        });
    </script>
</body>
</html>
