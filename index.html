<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvard Referencing Tutorial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Harvard Referencing V2</h1>
            <p class="subtitle">Master the art of academic referencing using this interactive tutorial system. Harvard referencing is one of the most widely used citation styles in academic writing.</p>
        </header>

        <main>
            <p class="call-to-action">Pick which text you would like to learn how to reference</p>
            
            <div class="button-grid">
    <button class="main-nav-button" onclick="window.location.href='book.html'">
        <h2>Books</h2>
        <p>Learn to reference books, textbooks, and monographs</p>
    </button>

    <button class="main-nav-button" onclick="window.location.href='journal.html'">
        <h2>Academic Journals</h2>
        <p>Master journal article and research paper citations</p>
    </button>

    <button class="main-nav-button" onclick="window.location.href='website.html'">
        <h2>Websites</h2>
        <p>Reference online sources and web content properly</p>
    </button>

    <button class="main-nav-button" onclick="window.location.href='reference-list.html'">
        <h2>Reference Lists</h2>
        <p>Create and format comprehensive reference lists</p>
    </button>

    <button class="main-nav-button" onclick="window.location.href='other-sources.html'">
        <h2>Other Sources</h2>
        <p>Newspapers, reports, media, personal communications, and AI</p>
    </button>

    <button class="main-nav-button" onclick="window.location.href='custom-practice.html'">
    <h2>Custom Practice</h2>
    <p>Pick the source types and subtypes you want to practise</p>
</button>
</div>
        </main>
    </div>

    <script src="script.js"></script>
